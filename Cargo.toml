[package]
authors = [
    "Guilhem Saurel <guilhem.saurel@laas.fr>",
    "Ferdia McKeogh <ferdia@mckeogh.tech>"
]
categories = ["embedded", "hardware-support", "no-std"]
description = "A platform agnostic driver to interface with the AHT20 temperature/humidity sensors"
documentation = "https://github.com/nim65s/aht20"
keywords = ["embedded-hal-driver", "temperature", "humidity", "aht20"]
license = "AGPL-3.0-or-later"
name = "aht20"
repository = "https://github.com/nim65s/aht20"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2"
cortex-m = { version = "0.7", optional = true, features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", optional = true }
crc = "3"
defmt = { version = "0.3", optional = true }
defmt-rtt = { version = "0.4", optional = true }
embassy-executor = { version = "0.5", optional = true, features = ["nightly", "integrated-timers"] }
embassy-stm32 = { version = "0.1", optional = true, features = [ "unstable-pac", "memory-x", "time-driver-any" ]  }
embassy-time = { version = "0.3", optional = true, features = ["tick-hz-1_000_000"] }
embedded-hal = "1"
embedded-hal-async = { version = "1", optional = true }
esp-backtrace = { version = "0.10", optional = true, features = ["panic-handler", "print-uart"] }
esp-hal-common = { version = "0.15", optional = true, features = ["eh1"] }
esp-println = { version = "0.8", optional = true }
esp32c3-hal = { version = "0.15", optional = true }
postcard = { version = "1", optional = true, features = ["postcard-derive", "experimental-derive"] }
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }
thiserror = { version = "1", package = "thiserror-core", default-features = false }
panic-probe = { version = "0.3", optional = true, features = ["print-defmt"] }

[features]
async = [
    "dep:embassy-time",
    "dep:embedded-hal-async",
]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "embassy-executor/defmt",
    "embassy-stm32/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "embedded-hal/defmt-03",
]
postcard = ["dep:postcard"]
serde = ["dep:serde"]
esp32 = [
    "dep:esp-backtrace",
    "dep:esp-hal-common",
    "dep:esp-println",
]
esp32c3 = [
    "esp32",
    "dep:esp32c3-hal",
    "esp-backtrace/esp32c3",
    "esp-hal-common/esp32c3",
    "esp-println/esp32c3",
]
stm32 = [
    "dep:cortex-m",
    "dep:cortex-m-rt",
]
async-esp32c3 = [
    "async",
    "esp32c3",
    "dep:embassy-executor",
    "embassy-executor/arch-riscv32",
    "esp-hal-common/async",
    "esp-hal-common/embassy",
    "esp-hal-common/embassy-time-timg0",
    "esp-hal-common/embassy-executor-thread",
]
async-stm32f1 = [
    "async",
    "defmt",
    "stm32",
    "dep:embassy-executor",
    "dep:embassy-stm32",
    "embassy-executor/arch-cortex-m",
    "embassy-executor/executor-thread",
    "embassy-stm32/stm32f103c8",
]

[[example]]
name = "esp32c3"
required-features = ["esp32c3"]

[[example]]
name = "async-esp32c3"
required-features = ["async-esp32c3"]

[[example]]
name = "async-stm32f1"
required-features = ["async-stm32f1"]

[profile.dev]
opt-level = "s"

[profile.release]
debug = 2
