[package]
authors = ["Ferdia McKeogh <ferdia@mckeogh.tech>"]
categories = ["embedded", "hardware-support", "no-std"]
description = "A platform agnostic driver to interface with the AHT20 temperature/humidity sensors"
documentation = "https://github.com/chocol4te/aht20"
keywords = ["embedded-hal-driver", "temperature", "humidity", "aht20"]
license = "AGPL-3.0-or-later"
name = "aht20"
repository = "https://github.com/chocol4te/aht20"
version = "0.1.0"
edition = "2018"

[dependencies]
embassy-time = { version = "0.1.5", features = ["nightly", "tick-hz-1_000_000"] }
bitflags = "2"
crc = "3"
postcard = { version = "1", optional = true, features = ["postcard-derive", "experimental-derive"] }
serde = { version = "=1.0.190", optional = true, default-features = false, features = ["derive"] }
embedded-hal-async = { version = "1.0.0-rc.1" }
thiserror = { version = "1", package = "thiserror-core", default-features = false }

embassy-executor = { version = "0.3.1", optional = true, features = ["nightly", "integrated-timers", "arch-riscv32", "executor-thread"] }
esp-backtrace = { version = "0.9.0", optional = true, features = ["esp32c3", "panic-handler", "print-uart"] }
esp-hal-common = { version = "0.13.0", optional = true, features = ["esp32c3", "embassy", "embassy-time-timg0", "async"] }
esp-println = { version = "0.7.0", optional = true, features = ["esp32c3"] }
esp32c3-hal = { version = "0.13.0", optional = true }

defmt = { version = "0.3.5", optional = true }

[features]
serde = ["dep:serde"]
postcard = ["dep:postcard"]
defmt = ["dep:defmt"]
esp32 = [
    "dep:embassy-executor",
    "dep:esp-backtrace",
    "dep:esp-hal-common",
    "dep:esp-println",
    "dep:esp32c3-hal",
]
